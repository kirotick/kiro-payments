name: CI
# Runs on every pull request and on main. Least-privilege token; third-party actions pinned to commit SHAs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
  tests:
    runs-on: ubuntu-24.04
    env:
      # Neon branch "qa" (never production). Without this secret the database tests are skipped, not failed.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: ws/kiro-payments }
      - name: Read pinned kiro-database version
        id: db
        run: echo "tag=$(cat ws/kiro-payments/service/node/database-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: kirotick/kiro-database, path: ws/kiro-database, ref: ${{ steps.db.outputs.tag }} }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Install and test
        working-directory: ws/kiro-payments/service/node
        run: npm ci --no-audit --no-fund && npm test
  codeql:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with: { languages: javascript }
      - uses: github/codeql-action/analyze@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
